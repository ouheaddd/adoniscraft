#Should the mysterious character appear at the beginning?
character_spawn = true
#Should the book be dropped at the beginning?
give_book = true
#Should the Halloween pumpkins be enabled?
halloween_hats = true

#Animal spawn settings. Changes require restarting the world/server.
#Set weight to 0 to stop an animal from spawning naturally.
#Use add_biomes to let an animal spawn in extra biomes.
[animal_spawns]

	[animal_spawns.beaver]
		#Spawn weight (higher = more common)
		# Default: 12
		# Range: 0 ~ 1000
		weight = 12
		#Minimum group size
		# Default: 3
		# Range: 1 ~ 64
		min_count = 3
		#Maximum group size
		# Default: 4
		# Range: 1 ~ 64
		max_count = 4
		#Extra biomes this animal can spawn in, on top of its default ones.
		#Accepts biome ids ("minecraft:plains") and biome tags ("#minecraft:is_forest").
		add_biomes = []

